<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-label="BRIDGE framework overview">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker>
    <marker id="arrd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker>
    <style>
      text{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#1F2937;text-rendering:geometricPrecision}
      .ttl{font-size:14px;font-weight:700}
      .sub{font-size:10px;fill:#6B7280}
      .band{font-size:11px;font-weight:700;letter-spacing:1.5px;fill:#9CA3AF}
      .edge{font-size:9.5px;fill:#6B7280}
      .cap{font-size:10.5px;fill:#6B7280}
      .note{font-size:10px;font-style:italic}
    </style>
  </defs>

  <rect width="1000" height="600" fill="#FFFFFF"/>

  <!-- band labels + divider -->
  <text x="40" y="92" class="band">OFFLINE · SYNTHESIS</text>
  <text x="40" y="322" class="band">ONLINE · REAL-DEVICE CONTROL</text>
  <line x1="40" y1="300" x2="960" y2="300" stroke="#E5E7EB" stroke-width="1"/>

  <!-- ============ TOP BAND ============ -->
  <!-- App (artifact) -->
  <rect x="40" y="120" width="120" height="56" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.4"/>
  <text x="100" y="145" text-anchor="middle" class="ttl">YunOS HDT App</text>
  <text x="100" y="161" text-anchor="middle" class="sub">source + manifest</text>

  <!-- Analyze (skill) -->
  <rect x="205" y="120" width="110" height="56" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.4"/>
  <text x="260" y="153" text-anchor="middle" class="ttl">Analyze</text>

  <!-- Scaffold (deterministic) -->
  <rect x="360" y="120" width="110" height="56" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.4"/>
  <text x="415" y="153" text-anchor="middle" class="ttl">Scaffold</text>

  <!-- Generate (skill) -->
  <rect x="515" y="120" width="110" height="56" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.4"/>
  <text x="570" y="153" text-anchor="middle" class="ttl">Generate</text>

  <!-- Verify (gate) -->
  <rect x="670" y="120" width="140" height="56" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="740" y="143" text-anchor="middle" class="ttl">Verify</text>
  <text x="740" y="159" text-anchor="middle" class="sub">validate-config · wire-check</text>

  <!-- MCP Server (output artifact) -->
  <rect x="855" y="120" width="130" height="56" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.4"/>
  <text x="920" y="153" text-anchor="middle" class="ttl">MCP Server</text>

  <!-- top arrows -->
  <line x1="162" y1="148" x2="201" y2="148" stroke="#6B7280" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="183" y="141" text-anchor="middle" class="edge">source</text>
  <line x1="327" y1="148" x2="356" y2="148" stroke="#6B7280" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="377" y="111" text-anchor="middle" class="edge">analysis.json</text>
  <line x1="482" y1="148" x2="511" y2="148" stroke="#6B7280" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="496" y="141" text-anchor="middle" class="edge">skeleton</text>
  <line x1="637" y1="148" x2="666" y2="148" stroke="#6B7280" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="651" y="111" text-anchor="middle" class="edge">rpc/config.json</text>
  <line x1="812" y1="148" x2="851" y2="148" stroke="#6B7280" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="832" y="141" text-anchor="middle" class="edge">pass</text>

  <!-- Curate (optional, dashed) -->
  <rect x="312" y="62" width="116" height="30" rx="7" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="370" y="81" text-anchor="middle" class="ttl">Curate (opt.)</text>
  <line x1="370" y1="92" x2="370" y2="138" stroke="#9CA3AF" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#arrd)"/>
  <text x="455" y="120" text-anchor="middle" class="edge">selection.json</text>

  <!-- callouts (below top band, above divider) -->
  <text x="415" y="212" text-anchor="middle" class="note" fill="#4338CA">deterministic core · no LLM inside the CLI</text>
  <text x="740" y="212" text-anchor="middle" class="note" fill="#B45309">fail-closed — blocks the build until rpc/config.json verifies</text>

  <!-- deploy connector (top MCP → bottom MCP), dashed L-path -->
  <path d="M920,176 V250 H285 V346" fill="none" stroke="#9CA3AF" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#arrd)"/>
  <text x="600" y="244" text-anchor="middle" class="edge">deploy (same artifact)</text>

  <!-- ============ BOTTOM BAND ============ -->
  <!-- Host Agent (skill) -->
  <rect x="40" y="350" width="140" height="56" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.4"/>
  <text x="110" y="373" text-anchor="middle" class="ttl">Host Agent</text>
  <text x="110" y="389" text-anchor="middle" class="sub">Claude / Codex</text>

  <!-- MCP Server (artifact) -->
  <rect x="225" y="350" width="120" height="56" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.4"/>
  <text x="285" y="383" text-anchor="middle" class="ttl">MCP Server</text>

  <!-- RPC Bridge (runtime) -->
  <rect x="390" y="350" width="140" height="56" rx="8" fill="#ECFEFF" stroke="#0E7490" stroke-width="1.4"/>
  <text x="460" y="373" text-anchor="middle" class="ttl">RPC Bridge</text>
  <text x="460" y="389" text-anchor="middle" class="sub">adb / file / sendlink</text>

  <!-- Car-side RpcEngine (runtime) -->
  <rect x="575" y="350" width="130" height="56" rx="8" fill="#ECFEFF" stroke="#0E7490" stroke-width="1.4"/>
  <text x="640" y="383" text-anchor="middle" class="ttl">Car-side RpcEngine</text>

  <!-- YunOS Device (device) -->
  <rect x="750" y="350" width="130" height="56" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.4"/>
  <text x="815" y="383" text-anchor="middle" class="ttl">YunOS Device</text>

  <!-- bottom arrows -->
  <line x1="182" y1="378" x2="221" y2="378" stroke="#6B7280" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="201" y="371" text-anchor="middle" class="edge">tool call</text>
  <line x1="347" y1="378" x2="386" y2="378" stroke="#6B7280" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="366" y="371" text-anchor="middle" class="edge">rpcCall</text>
  <line x1="532" y1="378" x2="571" y2="378" stroke="#6B7280" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="551" y="371" text-anchor="middle" class="edge">adb</text>
  <line x1="707" y1="378" x2="746" y2="378" stroke="#6B7280" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="726" y="371" text-anchor="middle" class="edge">actuate</text>

  <!-- return path (dashed) -->
  <line x1="815" y1="425" x2="290" y2="425" stroke="#9CA3AF" stroke-width="1.1" stroke-dasharray="5 3" marker-end="url(#arrd)"/>
  <text x="550" y="440" text-anchor="middle" class="edge">result / sensor readback</text>

  <!-- ============ LEGEND ============ -->
  <rect x="40" y="468" width="14" height="14" rx="2" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.3"/>
  <text x="62" y="480" class="cap">LLM skill</text>
  <rect x="160" y="468" width="14" height="14" rx="2" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.3"/>
  <text x="182" y="480" class="cap">Deterministic CLI</text>
  <rect x="320" y="468" width="14" height="14" rx="2" fill="#FFFBEB" stroke="#D97706" stroke-width="1.3"/>
  <text x="342" y="480" class="cap">Verification gate</text>
  <rect x="480" y="468" width="14" height="14" rx="2" fill="#ECFEFF" stroke="#0E7490" stroke-width="1.3"/>
  <text x="502" y="480" class="cap">Runtime bridge</text>
  <rect x="630" y="468" width="14" height="14" rx="2" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/>
  <text x="652" y="480" class="cap">Artifact / device</text>

  <!-- caption -->
  <text x="500" y="556" text-anchor="middle" class="cap"><tspan font-weight="700" fill="#1F2937">Figure 1.</tspan> BRIDGE — offline deterministic synthesis with fail-closed verification yields a controllable MCP Server; online, a host agent drives the real device over the RPC bridge.</text>
</svg>
