<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-label="BRIDGE layered architecture">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker>
    <linearGradient id="mcp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4F46E5"/><stop offset="1" stop-color="#7C3AED"/></linearGradient>
    <style>
      text{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#1F2937;text-rendering:geometricPrecision}
      .h{font-size:17px;font-weight:700}
      .t{font-size:13.5px;font-weight:700}
      .s{font-size:10.5px;fill:#6B7280}
      .band{font-size:10px;font-weight:700;letter-spacing:1.5px;fill:#6366F1}
      .e{font-size:10px;fill:#6B7280}
      .note{font-size:10.5px;font-style:italic;fill:#4338CA}
      .cap{font-size:10.5px;fill:#6B7280}
    </style>
  </defs>

  <rect width="1000" height="700" fill="#FFFFFF"/>
  <text x="500" y="34" text-anchor="middle" class="h">BRIDGE — Layered Architecture</text>

  <!-- L1 Application -->
  <rect x="350" y="58" width="300" height="58" rx="10" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.4"/>
  <text x="500" y="83" text-anchor="middle" class="t">YunOS HDT app</text>
  <text x="500" y="101" text-anchor="middle" class="s">source + manifest</text>
  <line x1="500" y1="116" x2="500" y2="144" stroke="#6B7280" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="513" y="133" class="e">capabilities</text>

  <!-- L2 Synthesis core -->
  <rect x="200" y="148" width="600" height="120" rx="12" fill="#FAFAFF" stroke="#C7D2FE" stroke-width="1.2"/>
  <text x="222" y="170" class="band">SYNTHESIS CORE · OFFLINE</text>
  <rect x="230" y="186" width="80" height="38" rx="7" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.3"/><text x="270" y="210" text-anchor="middle" class="t">Analyze</text>
  <line x1="312" y1="205" x2="338" y2="205" stroke="#6B7280" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="340" y="186" width="92" height="38" rx="7" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.2" stroke-dasharray="4 3"/><text x="386" y="210" text-anchor="middle" class="t">Curate*</text>
  <line x1="434" y1="205" x2="458" y2="205" stroke="#9CA3AF" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <rect x="460" y="186" width="90" height="38" rx="7" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.3"/><text x="505" y="210" text-anchor="middle" class="t">Scaffold</text>
  <line x1="552" y1="205" x2="576" y2="205" stroke="#6B7280" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="578" y="186" width="92" height="38" rx="7" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.3"/><text x="624" y="210" text-anchor="middle" class="t">Generate</text>
  <text x="500" y="252" text-anchor="middle" class="note">✦ deterministic core · no LLM inside the CLI</text>
  <line x1="500" y1="268" x2="500" y2="296" stroke="#6B7280" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="513" y="285" class="e">rpc/config.json</text>

  <!-- L3 Verification gate -->
  <rect x="320" y="300" width="360" height="60" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.8"/>
  <text x="500" y="325" text-anchor="middle" class="t" fill="#B45309">⊗  validate-config  +  wire-check</text>
  <text x="500" y="344" text-anchor="middle" class="s">fail-closed gate</text>
  <line x1="500" y1="360" x2="500" y2="388" stroke="#6B7280" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="513" y="377" class="e">produces</text>

  <!-- L4 Interface (MCP Server, emphasized) -->
  <rect x="370" y="392" width="260" height="68" rx="12" fill="url(#mcp)" stroke="#4338CA" stroke-width="1.6"/>
  <text x="500" y="423" text-anchor="middle" class="t" fill="#FFFFFF">★ MCP Server</text>
  <text x="500" y="443" text-anchor="middle" class="s" fill="#C7D2FE">controllable tools</text>

  <!-- T-split: MCP → Agent (left) / Bridge (right) -->
  <line x1="500" y1="460" x2="500" y2="486" stroke="#6B7280" stroke-width="1.4"/>
  <line x1="170" y1="486" x2="640" y2="486" stroke="#6B7280" stroke-width="1.4"/>
  <line x1="170" y1="486" x2="170" y2="511" stroke="#6B7280" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="640" y1="486" x2="640" y2="511" stroke="#6B7280" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="335" y="479" text-anchor="middle" class="e">tool call</text>
  <text x="570" y="479" text-anchor="middle" class="e">rpcCall</text>

  <!-- Runtime row -->
  <rect x="95" y="514" width="150" height="66" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.4"/>
  <text x="170" y="542" text-anchor="middle" class="t">Host Agent</text>
  <text x="170" y="560" text-anchor="middle" class="s">Claude / Codex</text>

  <rect x="580" y="514" width="120" height="66" rx="9" fill="#ECFEFF" stroke="#0E7490" stroke-width="1.4"/>
  <text x="640" y="542" text-anchor="middle" class="t">RPC Bridge</text>
  <text x="640" y="560" text-anchor="middle" class="s">adb / sendlink</text>
  <line x1="702" y1="547" x2="718" y2="547" stroke="#6B7280" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="710" y="540" text-anchor="middle" class="e">adb</text>

  <rect x="720" y="514" width="120" height="66" rx="9" fill="#ECFEFF" stroke="#0E7490" stroke-width="1.4"/>
  <text x="780" y="540" text-anchor="middle" class="t">Car-side</text>
  <text x="780" y="556" text-anchor="middle" class="t">RpcEngine</text>
  <line x1="842" y1="547" x2="858" y2="547" stroke="#6B7280" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="850" y="540" text-anchor="middle" class="e">actuate</text>

  <rect x="860" y="514" width="120" height="66" rx="9" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.4"/>
  <text x="920" y="540" text-anchor="middle" class="t">YunOS</text>
  <text x="920" y="556" text-anchor="middle" class="t">Device</text>

  <!-- Legend -->
  <rect x="150" y="618" width="14" height="14" rx="2" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.3"/><text x="170" y="630" class="cap">LLM skill</text>
  <rect x="270" y="618" width="14" height="14" rx="2" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.3"/><text x="290" y="630" class="cap">Deterministic CLI</text>
  <rect x="440" y="618" width="14" height="14" rx="2" fill="#FFFBEB" stroke="#D97706" stroke-width="1.3"/><text x="460" y="630" class="cap">Verification gate</text>
  <rect x="600" y="618" width="14" height="14" rx="2" fill="#ECFEFF" stroke="#0E7490" stroke-width="1.3"/><text x="620" y="630" class="cap">Runtime bridge</text>
  <rect x="760" y="618" width="14" height="14" rx="2" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="780" y="630" class="cap">Artifact / device</text>

  <text x="500" y="676" text-anchor="middle" class="cap"><tspan font-weight="700" fill="#1F2937">Figure 1.</tspan> BRIDGE overview — a deterministic synthesis core with a fail-closed verification gate produces a controllable MCP Server; online, a host agent drives the real YunOS device over the RPC bridge.  (*Curate optional.)</text>
</svg>
