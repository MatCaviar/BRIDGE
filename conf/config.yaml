# MCP CodeAgent Pipeline configuration
# Reference: zaxis-agent conf structure

framework:
  # Relative path from generated MCP project to the framework package
  # Override with --framework-path CLI arg
  path: "../framework"

gateway:
  path: "../mcp-gateway"
  config: "config.yaml"

adapter:
  # Default adapter mode for scaffolded projects
  mock_mode: true

safety_levels:
  - readonly
  - normal
  - p_gear_required
  - p_gear_and_confirm
  - p_gear_and_network

build:
  tsc_args: []
  target: "ES2022"
  module: "Node16"
