# Default model configuration; replace with your own provider config when needed.
llm:
  provider: openai
  model: qwen3.5-flash
  api_key: ${QWEN_API_KEY}
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  temperature: 0.7
  max_tokens: 4096
  thinking: true

mcp_servers:
  - name: bridge
    transport: stdio
    command: node
    args: ["bridge-serve-wrapper.mjs", "--", "../cli/bin/mcp-pipeline.js", "serve", "--analysis", "bridge-analysis.json", "--timeout", "20000"]

task:
  system_prompt: |
    你是当前项目的应用助手，用中文简短回复用户，通过注入的 MCP 工具完成操作。
    - 工具名称、参数、动作分支和值域以注入 schema 为准；只调用本次交付范围内的能力。
    - 指令所需信息充分时执行；信息缺失时简短追问。
    - 统一入口通过 action 区分操作，严格使用该分支的业务参数，extras 只传已声明的上下文。
    - 工具返回失败或设备不可达时说明原因；成功后按返回结果确认，必要时查询实际状态。
    - 返回 simulation:true 时说明这是仿真结果。超出当前工具范围的请求，直接说明并回应。
    本次任务工具清单：
    (本行由 viz/run.mjs 按本次分析产物自动替换为工具清单)
  user_message: "你好"
  max_turns: 15
