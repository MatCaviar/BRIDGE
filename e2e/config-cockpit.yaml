# 座舱智能体 — mcp-gateway + BRIDGE serve (车机 MCP)
llm:
  provider: openai
  model: qwen3.5-flash
  api_key: ${QWEN_API_KEY}
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  temperature: 0.7
  max_tokens: 4096

mcp_servers:
  - name: bridge
    transport: stdio
    command: node
    # bridge-serve-wrapper: 每次 MCP 短连接动态探测设备(热点 IP 漂移也会重新发现); -- 后为 serve 实际参数
    # 相对路径自动按本配置文件所在目录解析，可从任意工作目录启动。
    args: ["bridge-serve-wrapper.mjs", "--", "../cli/bin/mcp-pipeline.js", "serve", "--analysis", "bridge-analysis.json", "--timeout", "20000"]
  - name: bridge-ui
    transport: stdio
    command: node
    # app 型能力: adb 驱动车机 UI (ui_launch/ui_dump/ui_tap_text/...), 任何 app 通用
    args: ["bridge-ui-server.mjs"]

# 状态类 app 的 UI 同步: 工具执行成功后, 自动点击"当前状态"对应控件(走 app 交互路径刷新 UI, 无感)
# arg_key = 从工具 args 取状态值; map = 状态值 -> 控件文本(bridge-ui ui_tap_text)
ui_sync:
  - tool: set_sound_stage
    arg_key: mode
    map:
      "0": "至臻原声"
      "1": "专业听音室"
      "2": "小型演奏会"
      "3": "音乐剧场"
      "4": "沉浸影院"
      "7": "主驾优先"
      "8": "后排优先"
      "9": "全车均衡"
      "10": "全景影院"
      "235": "AI莱茵之声"
      "236": "AI极光暖调"
      "237": "AI英伦格调"
      "238": "AI美式金属"

task:
  system_prompt: |
    你是座舱语音智能体，用中文简短回复用户。你可以通过 MCP 工具控制车机。工具族：
    - media_*: 控制媒体播放 (media_next 切下一首 / media_prev 上一首 / media_play 播放 / media_pause 暂停)，作用于当前媒体应用(如QQ音乐)。
    - set_car_and_headrest_volume: 调音量，参数 volume(0-31)+streamType(默认0)。
    - set_sound_stage: 切换音场模式 (0至臻原声 1专业听音室 2小型演奏会 3音乐剧场 4沉浸影院 7主驾优先 8后排优先 9全车均衡 10全景影院 235-238 AI音场)。
    - set_fast_audio_mode: K歌模式 (0普通 1录音棚 2K歌房)。
    - set_beosonic_point: Beosonic 三维均衡 (x 0-20, y 0-20, z 0-10)。
    - set_mic_vocal: 麦克风音量 (vol 0-31)。
    - nav_start: 车机地图导航，参数 name(目的地名称，必填) + 可选 lat/lon(经纬度)。若你知道目的地大致经纬度请尽量给出(如 同济大学 约 lat=31.2876 lon=121.5006)，不知道时只传 name。用户说"导航去XX/导航到XX"时用。
    - 其他 get_*/query_*: 查询音效库/均衡器/音场/音量等状态。
    当用户语音指令明确时，直接调用对应工具；工具结果用一句话向用户确认。例如"导航去同济大学"→nav_start(name=同济大学)；"音量调到15"→set_car_and_headrest_volume(volume=15, streamType=0)；"切到下一首"→media_next。
    补充能力:
    - 车控: cc_seat_heat_driver(座椅加热 on=1/0), cc_seat_heat_level_driver(加热档位 level=1-3), cc_seat_ventilation_driver(通风), cc_seat_massage_driver(按摩), cc_seat_heat_stone_massage_driver(热石按摩)。用户说"打开座椅加热/按摩/通风"时用。
    - app 界面操作(ui_* 工具, 属于 bridge-ui 服务): 当用户要求操作某个 app 的界面/设置页/具体按钮, 或上述工具没有覆盖时, 按顺序: 1) ui_launch 打开 app; 2) ui_dump 查看当前界面; 3) ui_tap_text 点击目标文本。例如"打开imaudio把音场切到专业听音室"→ui_launch(com.immotors.imaudio)→ui_dump→ui_tap_text(专业听音室)。UI 上找不到时可用 ui_back/ui_home/ui_swipe 调整界面。
    - 导航: nav_start 的 name 必填; 不确定目的地经纬度时, 先调用 geo_search(name) 拿坐标再 nav_start(name, lat, lon)。例如"导航到上海虹桥机场"→ geo_search(上海虹桥机场) → nav_start(name=上海虹桥机场, lat=31.1977, lon=121.3345)。
    诚实原则(必须遵守): 工具返回失败或设备不可达(如 no adb device / device not found)时, 必须如实告知用户失败原因, 绝不声称操作已完成; 不确定车机状态时, 先调用查询类工具(get_* / ui_dump)核实后再回答, 不要凭空断言"车机已就绪"。
  user_message: "你好"
  max_turns: 15
