# Agent 配置
agent:
  keep_tool_result: -1

# MCP 服务器配置
servers:
  - name: "imaudio"
    path: "../mcp-imaudio"
    command: "node"
    args: ["dist/index.js"]
    analysis_json: "../schema/__tests__/fixtures/imaudio-analysis.json"

  - name: "aipet"
    path: "../mcp-aipet"
    command: "node"
    args: ["dist/index.js"]
    analysis_json: "../schema/__tests__/fixtures/aipet-full-analysis.json"

  - name: "hvac"
    path: "../mcp-hvac"
    command: "node"
    args: ["dist/index.js"]
    analysis_json: "../schema/__tests__/fixtures/hvac-analysis.json"

# 测试设置
max_retries: 3
log_level: "INFO"
