# E2E Test Runner Configuration
# LLM config - aligned with Z-AXIS format

# 选择要使用的模型 (可通过环境变量 QWEN_MODEL 覆盖)
# 可选值: qwen3.6-flash, qwen3.6-plus, qwen3.7-max, qwen3.5-flash, qwen3.5-plus
model_profile: qwen3.6-flash

# LLM 模型配置档案
model_profiles:
  qwen3.6-flash:
    provider: "openai"
    model_name: "qwen3.6-flash"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    api_key: sk-215192bea63c4568bf6c1eb509e9fc9f
    async_client: true
    temperature: 0.7
    top_p: 0.95
    min_p: 0.0
    top_k: -1
    max_tokens: 64000
    repetition_penalty: 1.05
    max_context_length: 262144
    # Enable streaming for faster perceived response
    stream: true
    # Enable thinking mode for better reasoning
    thinking_mode: "auto"

  qwen3.6-plus:
    provider: "openai"
    model_name: "qwen3.6-plus"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
